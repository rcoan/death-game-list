services:
  postgres:
    image: postgres:16-alpine
    container_name: deaths_game_postgres
    environment:
      POSTGRES_USER: deaths_game
      POSTGRES_PASSWORD: deaths_game_password
      POSTGRES_DB: deaths_game_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deaths_game"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

